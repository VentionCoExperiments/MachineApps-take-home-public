# Run the whole stack (backend + frontend) with `docker compose up`.
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      # Uses the compose service name since both containers share the default network.
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
